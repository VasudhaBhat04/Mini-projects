<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timer widget</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

  <div class="widget-container">
    <!-- Top Window Title & Control Bar -->
    <div class="header-bar">
      <span class="title">Let's Focus !!!</span>
      <div class="controls">
        <button class="control-btn" id="minimizeBtn">-</button>
        <button class="control-btn" id="closeBtn">x</button>
      </div>
    </div>

    <!-- Inner White Workspace Card -->
    <div class="inner-card">
      <div class="cat-box" id="catBox"></div>


      <!-- State Text or Live Timer Countdown Display -->
      <div class="status-text" id="timerDisplay">START THE STUDY TIMER</div>
      
      <!-- Dynamic Action Button Area Container -->
      <div class="button-group" id="buttonGroup">
        <!-- Buttons are dynamically generated and injected here by script.js -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
