<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Timer widget</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

  <div class="widget-container">
   
    <div class="header-bar">
      <span class="title">NEKO TIMER</span>
      <div class="controls">
        <button class="control-btn" id="minimizeBtn">-</button>
        <button class="control-btn" id="closeBtn">x</button>
      </div>
    </div>

  
    <div class="inner-card">
      <div class="cat-box" id="catBox"></div>


      
      <div class="status-text" id="timerDisplay">START THE STUDY TIMER ^..^ </div>
      
      
      <div class="button-group" id="buttonGroup">
       
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
